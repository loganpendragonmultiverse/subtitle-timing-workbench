[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-timing-workbench"
version = "0.1.0"
description = "Validate local SRT/WebVTT timing and review source-preserving offsets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Logan Pendragon Multiverse"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
subtitle-timing-workbench = "subtitle_timing_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=subtitle_timing_workbench --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
omit = ["src/*/__main__.py"]
